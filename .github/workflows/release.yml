name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos-arm64:
    runs-on: macos-15
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --target aarch64-apple-darwin
      - run: python3 tests/ipc.py target/aarch64-apple-darwin/release/zed-fork-pdf-viewer
      - run: python3 scripts/package.py target/aarch64-apple-darwin/release/zed-fork-pdf-viewer
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "PDF Viewer $GITHUB_REF_NAME" --generate-notes
